<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | Nano Motion</title>
<link rel="preconnect" href="https://bzrcdn.openai.com">
<!-- OpenAI Measurement Pixel: same block, top of <head>, on every page.
     Order matters: 1) decide consent  2) load SDK  3) set consent BEFORE init  4) init. -->
<script src="assets/pixel-init.js?v=2"></script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="checkout">
<main class="wrap">
  <div class="two-col">
    <form id="co" autocomplete="on">
      <h1 style="font-size:2.2rem">Checkout</h1>
      <p class="muted">Guest checkout. This is a demo store: no payment is taken and nothing ships.</p>
      <h2 class="h3">Contact</h2>
      <label class="field">Email<input name="email" type="email" required autocomplete="email"></label>
      <label class="field">Phone (optional)<input name="phone" type="tel" autocomplete="tel" placeholder="+1 415 555 2671"></label>
      <h2 class="h3">Shipping</h2>
      <div class="row2">
        <label class="field">First name<input name="firstName" required autocomplete="given-name"></label>
        <label class="field">Last name<input name="lastName" required autocomplete="family-name"></label>
      </div>
      <label class="field">Address<input name="address" required autocomplete="street-address"></label>
      <div class="row2">
        <label class="field">City<input name="city" required autocomplete="address-level2"></label>
        <label class="field">Postal code<input name="postalCode" required autocomplete="postal-code"></label>
      </div>
      <label class="field">Country<input name="country" id="co-country" readonly></label>
      <h2 class="h3">Payment</h2>
      <label class="field">Card number<input value="4242 4242 4242 4242 (demo, not charged)" readonly></label>
      <button class="btn btn-block" id="place">Place order</button>
      <p class="note">Your email is hashed (SHA-256) in your browser before anything is shared for ad measurement. See our <a href="privacy.html">privacy notice</a>.</p>
    </form>
    <aside class="summary" id="co-summary"></aside>
  </div>
</main>

<script src="assets/products.js"></script>
<script src="assets/store.js"></script>
<script src="assets/eventlog.js"></script>
<script src="assets/tracking.js"></script>
<script src="assets/consent.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/pages/checkout.js"></script>
</body>
</html>
